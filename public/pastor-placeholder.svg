<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d3a2a"/>
      <stop offset="60%" stop-color="#27503a"/>
      <stop offset="100%" stop-color="#17324e"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <rect width="400" height="500" fill="url(#bg)"/>
  <rect width="400" height="500" fill="url(#vignette)"/>

  <!-- Simple silhouette: head + shoulders, centered, upper third -->
  <g fill="#d4b878" opacity="0.55">
    <circle cx="200" cy="195" r="52"/>
    <path d="M100 355 C100 295, 135 262, 200 262 C265 262, 300 295, 300 355 L300 380 L100 380 Z"/>
  </g>

  <!-- Thin decorative rule -->
  <line x1="140" y1="420" x2="260" y2="420" stroke="#d4b878" stroke-width="1" opacity="0.6"/>

  <!-- Labels -->
  <text x="200" y="448" font-family="Georgia, serif" font-size="20" fill="#ffffff" text-anchor="middle" font-style="italic" opacity="0.95">
    Pastor Justin Martin
  </text>
  <text x="200" y="472" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#d4b878" text-anchor="middle" letter-spacing="3" font-weight="600">
    PHOTO  COMING  SOON
  </text>
</svg>
